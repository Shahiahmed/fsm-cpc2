<title>Центр поддержки семьи 2.0</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Onest:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --line:#D5DDDB; --line-2:#E6ECEA;
  --ink:#14211F; --muted:#566865; --faint:#8A9A97;
  --accent:#0B6B66; --accent-hover:#08564F; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --side:#0F2B29; --side-ink:#D3E5E2; --side-muted:#86A6A1; --side-active:#1C4845; --side-line:#1E3F3C;
  --ok:#2A7545; --ok-soft:#E1F1E6; --warn:#9A5F0B; --warn-soft:#FBEFD9; --bad:#AF372B; --bad-soft:#F9E3DF;
  --info:#39598A; --info-soft:#E4EBF6; --violet:#654A97; --violet-soft:#EEE8F7;
  --shadow:0 1px 2px rgba(16,40,38,.06),0 10px 30px rgba(16,40,38,.10);
  --r:10px;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Onest","Golos Text",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1615; --surface:#15201E; --surface-2:#1A2725; --line:#2B3B39; --line-2:#22312F;
    --ink:#E3EDEB; --muted:#9AADA9; --faint:#6F827E;
    --accent:#3DB3A9; --accent-hover:#5CC6BC; --accent-ink:#04201D; --accent-soft:#143A37;
    --side:#0A1312; --side-ink:#D3E5E2; --side-muted:#7C9A95; --side-active:#173633; --side-line:#1A2B29;
    --ok:#5CC082; --ok-soft:#173422; --warn:#E3A84C; --warn-soft:#3A2A10; --bad:#EE7D70; --bad-soft:#3D1C18;
    --info:#86A7DD; --info-soft:#1C2A40; --violet:#B39BE3; --violet-soft:#2A2140;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1615; --surface:#15201E; --surface-2:#1A2725; --line:#2B3B39; --line-2:#22312F;
  --ink:#E3EDEB; --muted:#9AADA9; --faint:#6F827E;
  --accent:#3DB3A9; --accent-hover:#5CC6BC; --accent-ink:#04201D; --accent-soft:#143A37;
  --side:#0A1312; --side-ink:#D3E5E2; --side-muted:#7C9A95; --side-active:#173633; --side-line:#1A2B29;
  --ok:#5CC082; --ok-soft:#173422; --warn:#E3A84C; --warn-soft:#3A2A10; --bad:#EE7D70; --bad-soft:#3D1C18;
  --info:#86A7DD; --info-soft:#1C2A40; --violet:#B39BE3; --violet-soft:#2A2140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
table{font-size:inherit;border-collapse:collapse}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--side-line)}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#2BA89E,#0B6B66);display:grid;place-items:center;font:700 13px var(--f-head);color:#fff;letter-spacing:.02em}
.brand b{font:600 15px var(--f-head);display:block;color:#fff}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--side-active)}
.nav button.on{background:var(--side-active);color:#fff;font-weight:500}
.nav button .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:10px}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.side-foot p{font-size:12px;color:var(--side-muted);padding:0 8px;line-height:1.45}
.side-foot button{background:none;border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.side-foot button:hover{background:var(--side-active)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:16px;padding:10px 28px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.proto{font-size:11.5px;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:20px;font-weight:500;letter-spacing:.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.me{display:flex;align-items:center;gap:9px}
.ava{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--f-head);flex:none}
.me b{display:block;font-weight:500;font-size:13px;line-height:1.2}
.me span{font-size:11.5px;color:var(--muted)}
.view{padding:24px 28px 60px;max-width:1360px;width:100%}

/* generic */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head .sp{flex:1}
.page-head p{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-new{background:var(--info-soft);color:var(--info)}
.p-assigned{background:var(--violet-soft);color:var(--violet)}
.p-active{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-refused{background:var(--bad-soft);color:var(--bad)}
.p-m-assigned{background:var(--warn-soft);color:var(--warn)}
.p-m-done{background:var(--ok-soft);color:var(--ok)}
.p-m-cancelled{background:var(--surface-2);color:var(--faint);border:1px solid var(--line-2)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;font-weight:500;letter-spacing:.01em}
.tag.cks{background:var(--info-soft);border-color:transparent;color:var(--info)}
.tag.man{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

.alert{display:flex;gap:10px;padding:11px 14px;border-radius:8px;align-items:flex-start;line-height:1.45}
.alert svg{margin-top:2px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert b{font-weight:600}
.alert .alert-t{color:var(--ink)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;min-width:720px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tbl tr.cancelled td{color:var(--faint)}
.tbl tr.cancelled .mname{text-decoration:line-through}

.prog{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bar{width:64px;height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* form */
.form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req::after{content:" *";color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-height:38px;transition:border-color .15s}
textarea.inp{min-height:76px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp[readonly]{background:var(--surface-2)}
.inp.mono{font-family:var(--f-mono)}
.hint{font-size:12px;color:var(--faint)}
.sec-t{font:600 13px var(--f-head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label,.checks label{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;background:var(--surface)}
.radios label:hover,.checks label:hover{border-color:var(--line)}
.radios input,.checks input{margin-top:3px;accent-color:var(--accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.files{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 9px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* cases list */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search svg{position:absolute;left:11px;top:11px;color:var(--faint)}
.search .inp{padding-left:34px}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;margin-bottom:20px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.flow div{flex:1 0 auto;padding:10px 14px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line-2);white-space:nowrap;position:relative}
.flow div:last-child{border-right:0}
.flow div b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.flow div.opt b{color:var(--muted);font-style:italic;font-weight:400}

/* case */
.case-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.case-head .ttl{flex:1;min-width:260px}
.case-head .ttl .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.case-head .meta{color:var(--muted);margin-top:6px;display:flex;gap:6px 16px;flex-wrap:wrap}
.case-actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px;font-size:13px}
.back:hover{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 18px;margin-bottom:16px;overflow-x:auto}
.step{display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--faint);font-size:13px}
.step .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-head);background:var(--surface)}
.step.past{color:var(--muted)}
.step.past .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.cur{color:var(--ink);font-weight:600}
.step.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step.cur.fin .dot{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 0 4px var(--ok-soft)}
.step-line{flex:1;min-width:28px;height:2px;background:var(--line);margin:0 12px}
.step-line.past{background:var(--accent)}
.step-sep{margin-left:auto;padding-left:24px;display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;white-space:nowrap}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line-2);padding:0 8px;scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 11px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:0 6px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab-body{padding:18px}
.ro-banner{display:flex;gap:12px;align-items:center;background:var(--ok-soft);color:var(--ok);padding:12px 16px;border-radius:var(--r);margin-bottom:16px;flex-wrap:wrap}
.ro-banner.refused{background:var(--bad-soft);color:var(--bad)}
.ro-banner div{flex:1;min-width:220px}
.ro-banner b{color:var(--ink);font-weight:600}
.ro-banner span{color:var(--ink);opacity:.8}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0}
.kv dt,.kv dd{padding:9px 0;border-bottom:1px solid var(--line-2);margin:0}
.kv dt{color:var(--muted);font-size:13px;padding-right:14px}
.kv dd{white-space:pre-wrap}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:72px}
.aside .card-b{padding:14px 16px}
.resp{display:flex;gap:11px;align-items:center}
.resp b{display:block;font-weight:600}
.resp span{font-size:12.5px;color:var(--muted)}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.conds li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4}
.conds .ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px;border:1.5px solid var(--line)}
.conds .ck svg{width:11px;height:11px;stroke-width:3}
.conds li.y .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.conds li.n{color:var(--muted)}
.path{list-style:none;margin:0;padding:0;position:relative}
.path li{display:flex;gap:10px;padding:5px 0;font-size:13px;position:relative;align-items:center}
.path li::before{content:"";position:absolute;left:5px;top:18px;bottom:-6px;width:2px;background:var(--line-2)}
.path li:last-child::before{display:none}
.path .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;position:relative;z-index:1}
.path li.y .d{background:var(--accent);border-color:var(--accent)}
.path li.y.fin .d{background:var(--ok);border-color:var(--ok)}
.path li.n{color:var(--faint)}
.path li .x{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.next{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:16px;flex-wrap:wrap}
.next div{flex:1;min-width:200px}
.next b{display:block;color:var(--accent);font-weight:600}
.empty{text-align:center;padding:36px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:28px;height:28px;color:var(--faint);stroke-width:1.5}
.empty b{color:var(--ink);font-weight:600}
.item{border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.item-h{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item-h .sp{flex:1}
.item-h h3{flex:1;min-width:200px}
.list{display:flex;flex-direction:column;gap:12px}
.meta-row{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta-row span{display:inline-flex;gap:6px;align-items:center}
.media{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:78px;height:58px;border-radius:7px;background:linear-gradient(135deg,#8FB5AE,#4E7F78 60%,#35615B);position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.ph:nth-child(2n){background:linear-gradient(135deg,#C4B69A,#8D7C5C)}
.ph:nth-child(3n){background:linear-gradient(135deg,#9AA9C4,#5B6B8D)}
.ph span{position:absolute;bottom:2px;left:5px;font:9.5px var(--f-mono);color:#fff;opacity:.9}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink)}

  const it=c.ipr?c.ipr.items:[];const done=it.filter(x=>x.status==='done');
  const reqOk=!!(c.iin&&c.fio&&c.dob&&c.address&&c.description&&c.responsible&&c.assessment);
  return [
    ['В кейсе создан ИПР',!!c.ipr],
    ['Есть хотя бы одна выполненная мера',done.length>0],
    ['У каждой выполненной меры заполнен результат',done.length>0&&done.every(x=>(x.result||'').trim())],
    ['Нет мер со статусом «Назначен»',!!c.ipr&&!it.some(x=>x.status==='assigned')],
    ['Нет выездов со статусом «Назначен»',!c.visits.some(v=>v.status==='assigned')],
    ['Обязательные данные кейса заполнены',reqOk],
  ];
}
function checkAuto(c){
  if(c.status!=='active')return false;
  if(conds(c).every(x=>x[1])){
    c.status='done';c.doneAt=nowStr();
    log(c,'Автоматическое завершение кейса',{user:'Система',old:'В сопровождении',nw:'Завершен',comment:'Все условия завершения выполнены'});
    setTimeout(()=>toast(`Кейс ${c.id} автоматически завершён. Карточка переведена в режим только для чтения.`,true),150);
    return true;
  }return false;
}
const willComplete=(c,exceptId)=>c.status==='active'&&c.ipr&&!c.ipr.items.some(x=>x.status==='assigned'&&x.id!==exceptId)&&!c.visits.some(v=>v.status==='assigned');

function runCheck(){
  const d=S.nd;if(!/^\d{12}$/.test(d.iin)){d.err='ИИН должен состоять из 12 цифр.';render();return}

  return null;
}

  const bad=rows.findIndex(r=>r.isNew&&(!r.recipient||!r.problem.trim()||!r.measure||!r.org));
  if(bad>=0){S.iprErr=`Строка ${bad+1}: заполните получателя, проблему, меру и организацию.`;render();return}
  if(!rows.length){S.iprErr='Добавьте хотя бы одну меру.';render();return}
  const first=!c.ipr;const t=nowStr();
  if(first)c.ipr={created:t,by:me(),items:[]};
  let added=0,changed=0;
  rows.forEach(r=>{
    if(r.isNew){c.ipr.items.push({id:'i'+uid(),recipient:r.recipient,problem:r.problem,measure:r.measure,org:r.org,executor:r.executor,expected:r.expected,comment:r.comment,status:'assigned'});added++;
      if(!first)log(c,'Изменение ИПР',{nw:'Добавлена мера: '+r.measure});
      log(c,'Назначение меры',{nw:`${r.measure} → ${r.executor||r.org}`});}
    else{const x=c.ipr.items.find(i=>i.id===r.id);if(!x||x.status!=='assigned')return;
      ['org','executor','expected','comment'].forEach(k=>{if((x[k]||'')!==(r[k]||'')){log(c,'Изменение ИПР',{old:`${x.measure}: ${x[k]||'—'}`,nw:r[k]||'—',comment:{org:'Организация',executor:'Исполнитель',expected:'Ожидаемый результат',comment:'Комментарий'}[k]});x[k]=r[k];changed++}});}
  });
  if(first){log(c,'Создание ИПР',{nw:`${added} ${plural(added,'мера','меры','мер')} поддержки`});if(c.status==='assigned'){c.status='active';log(c,'Смена статуса кейса',{user:'Система',old:'Назначен',nw:'В сопровождении'})}}
  else if(added||changed)c.ipr.updated=t;
  S.iprDraft=null;S.iprErr='';render();
  toast(first?`ИПР сохранён. ${added} ${plural(added,'мера назначена','меры назначены','мер назначено')}, кейс в сопровождении.`:'Изменения ИПР сохранены, история зафиксирована.',true);
}

/* ================= modal engine ================= */
let M=null;
function openModal(cfg){M=Object.assign({v:{},err:''},cfg);drawModal();setTimeout(()=>{const f=$('#modal .mbody input:not([type=file]),#modal .mbody select,#modal .mbody textarea');if(f)f.focus()},30)}
function closeModal(){M=null;drawModal()}
function drawModal(){
  const r=$('#modal');if(!M){r.hidden=true;r.innerHTML='';return}
  const sc=r.querySelector('.mbody')?r.querySelector('.mbody').scrollTop:0;
  r.hidden=false;
  r.innerHTML=`<div class="mback" data-action="mclose"></div><div class="modal ${M.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mhead"><h2 id="mt">${M.title}</h2><button class="icon-btn" data-action="mclose" aria-label="Закрыть">${ic('x')}</button></div>
    <div class="mbody">${M.err?`<div class="alert bad">${ic('alert')}<div>${M.err}</div></div>`:''}${M.render(M.v)}</div>
    <div class="mfoot">${M.footNote?`<span class="sp small muted" style="align-self:center">${M.footNote}</span>`:''}${(M.buttons||[]).map((b,i)=>`<button class="btn ${b.cls||''}" data-action="mbtn" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
  const b=r.querySelector('.mbody');if(b)b.scrollTop=sc;
}
const mv=(k,v)=>M&&(M.v[k]??v);
const mIn=(k,l,o={})=>`<div class="field"><label for="mv-${k}" class="${o.req?'req':''}">${l}</label>${o.ta?`<textarea class="inp" id="mv-${k}" data-mv="${k}" placeholder="${o.ph||''}">${esc(M.v[k]||'')}</textarea>`:`<input class="inp ${o.mono?'mono':''}" id="mv-${k}" type="${o.type||'text'}" data-mv="${k}" value="${esc(M.v[k]||'')}" placeholder="${o.ph||''}">`}${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;
const mSel=(k,l,opts,o={})=>`<div class="field"><label for="mv-${k}" class="${o.req?'req':''}">${l}</label><select class="inp" id="mv-${k}" data-mv="${k}" ${o.rer?'data-mrer="1"':''}><option value="">— выберите —</option>${opts.map(x=>`<option ${M.v[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
const mRadios=(k,l,opts,o={})=>`<div class="field"><span class="lbl ${o.req?'req':''}">${l}</span><div class="radios">${opts.map((x,i)=>`<label><input type="radio" name="mv-${k}" id="mv-${k}-${i}" data-mv="${k}" data-mrer="1" value="${esc(x)}" ${M.v[k]===x?'checked':''}>${esc(x)}</label>`).join('')}</div></div>`;
const mFiles=(k,l,o={})=>`<div class="field"><span class="lbl ${o.req?'req':''}">${l}</span><div class="files">${(M.v[k]||[]).map(n=>`<span class="file">${ic('file')}${esc(n)}</span>`).join('')}<label class="btn sm upl">${ic('plus')}${o.btn||'Прикрепить'}<input type="file" multiple data-mfiles="${k}"></label>${o.extra||''}</div>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;

/* ---------- actions with modals ---------- */
function mAssign(c){
  const re=!!c.responsible;
  openModal({title:re?'Переназначение ответственного':'Назначение ответственного',v:{u:re?'':''},
    render:()=>`${re?`<div class="alert info">${ic('info')}<div>Текущий ответственный: <b>${c.responsible}</b>. Изменение будет зафиксировано в истории.</div></div>`:''}
      ${mSel('u','Ответственный пользователь',ADMINS.filter(u=>u!==c.responsible),{req:1})}${mIn('comment','Комментарий',{ta:1})}`,
    buttons:[{label:'Отмена',act:closeModal},{label:re?'Переназначить':'Назначить',cls:'primary',act:v=>{
      if(!v.u)return 'Выберите ответственного.';
      const old=c.responsible||'—';c.responsible=v.u;c.respSince=nowStr();
      log(c,re?'Переназначение ответственного':'Назначение ответственного',{old,nw:v.u,comment:v.comment});
      if(c.status==='new'){c.status='assigned';log(c,'Смена статуса кейса',{user:'Система',old:'Новый',nw:'Назначен'})}
      toast(`Ответственный: ${v.u}`,true);}}]});
}
function mDone(c,x){
  const warn=willComplete(c,x.id);
  openModal({title:'Выполнение меры',v:{files:[]},
    render:()=>`<div class="item" style="background:var(--surface-2)"><b>${esc(x.measure)}</b><div class="meta-row"><span>${esc(memberName(c,x.recipient))}</span><span>${esc(x.org)}</span></div><div class="small muted">Ожидаемый результат: ${esc(x.expected)||'—'}</div></div>
      ${warn?`<div class="alert warn">${ic('alert')}<div><b>После выполнения данной меры кейс будет автоматически завершен.</b><div class="small">Это последняя активная мера, назначенных выездов нет.</div></div></div>`:''}
      ${mIn('result','Результат выполнения',{req:1,ta:1,ph:'Что сделано и какой получен результат'})}${mIn('comment','Комментарий',{ta:1})}${mFiles('files','Вложения к результату')}`,
    buttons:[{label:'Отмена',act:closeModal},{label:warn?'Выполнить и завершить кейс':'Отметить выполненной',cls:'primary',act:v=>{
      if(!(v.result||'').trim())return 'Поле «Результат выполнения» обязательно для перевода меры в статус «Выполнен».';
      Object.assign(x,{status:'done',result:v.result,resComment:v.comment||'',files:v.files,doneAt:nowStr(),doneBy:me()});
      v.files.forEach(n=>c.docs.push({name:n,from:'Мера: '+x.measure,at:nowStr(),by:me()}));
      log(c,'Выполнение меры',{old:'Назначен',nw:'Выполнен — '+x.measure,comment:v.result});
      if(!checkAuto(c))toast('Мера выполнена',true);}}]});
}
function mCancel(c,x){
  openModal({title:'Отмена меры',
    render:v=>`<div class="item" style="background:var(--surface-2)"><b>${esc(x.measure)}</b><div class="small muted">${esc(memberName(c,x.recipient))} · ${esc(x.org)}</div></div>
      ${mRadios('reason','Причина отмены',CANCEL_REASONS,{req:1})}
      ${v.reason==='Отказ получателя от конкретной меры'?`<div class="alert info">${ic('info')}<div>Отменяется только эта мера — сопровождение кейса продолжается. Для полного отказа используйте «Отказ от сопровождения».</div></div>`:''}
      ${mIn('comment','Комментарий',{ta:1,req:v.reason==='Другое'})}
      <p class="hint">Мера не удаляется — она остаётся в ИПР со статусом «Отменен».</p>`,
    buttons:[{label:'Назад',act:closeModal},{label:'Отменить меру',cls:'danger-solid',act:v=>{
      if(!v.reason)return 'Выберите причину отмены.';
      if(v.reason==='Другое'&&!(v.comment||'').trim())return 'При причине «Другое» комментарий обязателен.';
      Object.assign(x,{status:'cancelled',cancelReason:v.reason,cancelComment:v.comment||'',cancelAt:nowStr(),cancelBy:me()});
      log(c,'Отмена меры',{old:'Назначен',nw:'Отменен — '+x.measure,reason:v.reason,comment:v.comment});
      if(!checkAuto(c))toast('Мера отменена');}}]});
}

function mSurvey(c,vis,existing){
  const S2={step:existing?3:1,member:existing?existing.member:'',tpl:existing?existing.tpl:'',ans:existing?JSON.parse(JSON.stringify(existing.answers)):{}};
  const readonly=existing&&(existing.status==='done'||isFinal(c)||S.role!=='admin');
  const mem=()=>c.family.find(m=>m.id===S2.member);
  openModal({title:existing?'Опрос':'Новый опрос при выезде',wide:true,v:{},
    render:()=>{
      const steps=`<div class="steps-mini">${['Член семьи','Сведения и шаблон','Ответы'].map((s,i)=>i+1===S2.step?`<b>${i+1}. ${s}</b>`:`<span>${i+1}. ${s}</span>`).join('<span>→</span>')}</div>`;
      if(S2.step===1)return `${readonly?'':steps}<p class="muted small">Список членов семьи получен из ЦКС и сохранён в кейсе.</p><div class="list" style="gap:6px">${c.family.map(m=>`<button class="member ${S2.member===m.id?'on':''}" data-action="sPick" data-id="${m.id}"><span class="ava">${initials(m.fio)}</span><span class="grow"><b style="font-weight:500">${esc(m.fio)}</b><br><span class="small muted">${m.rel} · ${ageOf(m.dob)} лет</span></span>${srcTag(m.src)}</button>`).join('')}</div>`;
      const m=mem();const tp=TEMPLATES.find(t=>t.id===S2.tpl);
      const info=`<div class="item" style="background:var(--surface-2)"><div class="item-h"><b>${esc(m.fio)}</b>${srcTag(m.src)}</div><div class="subgrid small"><div><span class="lbl">ИИН</span><span class="mono">${m.iin||'—'}</span></div><div><span class="lbl">Дата рождения</span><span class="mono">${m.dob}</span> (${ageOf(m.dob)} лет)</div><div><span class="lbl">Родственная связь</span>${m.rel}${m.src==='ЦКС'?' <span class="hint">— из ЦКС, не редактируется</span>':''}</div><div><span class="lbl">Адрес</span>${esc(c.address)}</div></div></div>`;
      if(S2.step===2)return `${steps}${info}<div class="field"><label for="s-tpl">Шаблон вопросов <span class="tag">подобран по возрасту</span></label><select class="inp" id="s-tpl" data-stpl="1">${TEMPLATES.map(t=>`<option value="${t.id}" ${S2.tpl===t.id?'selected':''}>${t.name} (${t.ages})</option>`).join('')}</select><span class="hint">Шаблоны хранятся в справочнике «Шаблоны опросов»</span></div>
        <div class="small muted">${tp.q.length} вопросов, из них обязательных: ${tp.q.filter(q=>q.req).length}</div>`;
      return `${readonly?'':steps}${info}<h3>${tp.name}</h3>${tp.q.map(q=>qField(q,S2.ans,readonly)).join('')}`;
    },
    buttons:readonly?[{label:'Закрыть',act:closeModal}]:[
      {label:'Назад',act:()=>{if(S2.step>1){S2.step--;M.err='';drawModal();return false}closeModal()}},
      {label:'Сохранить как незавершённый',cls:'ghost',act:()=>{if(S2.step<3)return 'Сначала выберите члена семьи и шаблон.';save('draft')}},
      {label:'Далее / завершить опрос',cls:'primary',act:()=>{
        if(S2.step===1){if(!S2.member)return 'Выберите члена семьи.';S2.tpl=S2.tpl||tplFor(ageOf(mem().dob));S2.step=2;M.err='';drawModal();return false}
        if(S2.step===2){S2.step=3;M.err='';drawModal();return false}
        const tp=TEMPLATES.find(t=>t.id===S2.tpl);const miss=tp.q.filter(q=>q.req&&(S2.ans[q.id]==null||S2.ans[q.id]===''||(Array.isArray(S2.ans[q.id])&&!S2.ans[q.id].length)));
        if(miss.length)return `Заполните обязательные вопросы (${miss.length}): ${miss.map(q=>'«'+q.t+'»').join(', ')}.`;
        save('done');}}],
    onPick:id=>{S2.member=id;S2.tpl=tplFor(ageOf(c.family.find(m=>m.id===id).dob));drawModal()},
    onTpl:v=>{S2.tpl=v;S2.ans={}},
    onAns:(k,v)=>{S2.ans[k]=v},onAnsMulti:(k,val,on)=>{const a=S2.ans[k]||[];S2.ans[k]=on?[...a,val]:a.filter(x=>x!==val)},
  });
  function save(st){
    const name=memberName(c,S2.member);const tpn=TEMPLATES.find(t=>t.id===S2.tpl).name;
    if(existing)Object.assign(existing,{answers:S2.ans,status:st,at:nowStr(),by:me()});
    else vis.surveys.push({id:'s'+uid(),member:S2.member,tpl:S2.tpl,status:st,at:nowStr(),by:me(),answers:S2.ans});
    log(c,existing?'Заполнение опроса':'Создание опроса',{nw:`${short(name)} — ${tpn}${st==='done'?'':' (не завершён)'}`});
    closeModal();render();toast(st==='done'?'Опрос сохранён':'Опрос сохранён как незавершённый',st==='done');
  }
}
function qField(q,ans,ro){
  const v=ans[q.id];const dis=ro?'disabled':'';
  let ctl='';
  if(q.type==='yesno')ctl=`<div class="opts">${['Да','Нет'].map(o=>`<label><input type="radio" name="q-${q.id}" data-ans="${q.id}" value="${o}" ${v===o?'checked':''} ${dis}>${o}</label>`).join('')}</div>`;
  else if(q.type==='single')ctl=`<div class="opts">${q.opts.map(o=>`<label><input type="radio" name="q-${q.id}" data-ans="${q.id}" value="${esc(o)}" ${v===o?'checked':''} ${dis}>${esc(o)}</label>`).join('')}</div>`;
  else if(q.type==='multi')ctl=`<div class="opts">${q.opts.map(o=>`<label><input type="checkbox" data-ansm="${q.id}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''} ${dis}>${esc(o)}</label>`).join('')}</div>`;
  else if(q.type==='text')ctl=`<textarea class="inp" id="q-${q.id}" data-ans="${q.id}" ${dis}>${esc(v||'')}</textarea>`;
  else ctl=`<input class="inp" style="max-width:220px" id="q-${q.id}" type="${q.type}" data-ans="${q.id}" value="${esc(v||'')}" ${dis}>`;
  return `<div class="q"><div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><span class="qt ${q.req?'req':''}">${q.t}</span><span class="qtype">${TYPE_LBL[q.type]}</span></div>${ctl}</div>`;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,d=el.dataset;const c=cur();
  const findM=()=>{const cc=getCase(d.c);return [cc,cc.ipr.items.find(x=>x.id===d.id)]};
  const findV=()=>{const cc=getCase(d.c);return [cc,cc.visits.find(x=>x.id===d.v)]};
  switch(a){
    case 'go':S.view=d.v;if(d.v==='new')S.nd=null;S.ad=null;S.iprDraft=null;render();window.scrollTo({top:0});break;
    case 'role':S.role=d.v;S.view=d.v==='admin'?'cases':'tasks';S.ad=null;S.iprDraft=null;render();break;
    case 'reset':DB=seed();S={...S,view:S.role==='admin'?'cases':'tasks',caseId:null,nd:null,ad:null,iprDraft:null,filter:'all',q:''};render();toast('Демо-данные восстановлены');break;
    case 'filter':S.filter=d.v;render();break;
    case 'open':closeModal();S.caseId=d.id;S.tab='overview';S.view='case';S.ad=null;S.iprDraft=null;S.mfilter='all';render();window.scrollTo({top:0});break;
    case 'tab':S.tab=d.v;if(d.v==='ipr'&&c&&!c.ipr&&c.assessment&&canEdit(c)&&!S.iprDraft){}render();break;
    case 'mfilter':S.mfilter=d.v;render();break;
    case 'dict':S.dictTab=d.v;render();break;
    case 'checkIin':runCheck();break;
    case 'demoIin':S.nd=emptyNd();S.nd.iin=d.v;runCheck();break;
    case 'ndKind':S.nd.kind=d.v;render();break;
    case 'ndSign':{const s=S.nd.signs;const i=s.indexOf(d.v);i<0?s.push(d.v):s.splice(i,1);render();break}
    case 'ndAddMember':mAddMember(null,true);break;
    case 'ndSubmit':submitNew();break;
    case 'assign':mAssign(c);break;
    case 'refuse':mRefuse(c);break;
    case 'returnCase':mReturn(c);break;
    case 'cksRefresh':log(c,'Получение данных из ЦКС',{user:'Система',nw:'Повторный запрос: изменений нет'});render();toast('Данные ЦКС актуальны — изменений в составе семьи нет');break;
    case 'addMember':mAddMember(c);break;
    case 'adEdit':{const a0=c.assessment||{problems:'',needs:c.needs||'',risks:c.risks||'',directions:[],orgs:[],expected:''};S.ad={caseId:c.id,...JSON.parse(JSON.stringify(a0)),err:''};render();break}
    case 'adCancel':S.ad=null;render();break;
    case 'adToggle':{const arr=S.ad[d.k];const i=arr.indexOf(d.v);i<0?arr.push(d.v):arr.splice(i,1);render();break}
    case 'adSave':{const A=S.ad;if(!A.problems.trim()||!A.needs.trim()||!A.risks.trim()||!A.expected.trim()||!A.directions.length){A.err='Заполните обязательные поля и выберите хотя бы одно направление поддержки.';render();return}
      const first=!c.assessment;c.assessment={at:nowStr(),by:me(),problems:A.problems,needs:A.needs,risks:A.risks,directions:A.directions,orgs:A.orgs,expected:A.expected};
      log(c,'Оценка потребностей',{nw:first?'Заполнена':'Изменена'});S.ad=null;render();toast(first?'Оценка сохранена. Следующий шаг — создание ИПР.':'Оценка обновлена',true);break}
    case 'iprEdit':S.iprErr='';S.iprDraft={caseId:c.id,rows:c.ipr?c.ipr.items.map(x=>({...x,isNew:false})).concat(c.ipr?[]:[]):[blankRow()]};if(c.ipr)S.iprDraft.rows.push(blankRow());S.tab='ipr';render();break;
    case 'iprAdd':S.iprDraft.rows.push(blankRow());render();break;
    case 'iprDel':S.iprDraft.rows.splice(+d.i,1);render();break;
    case 'iprCancel':S.iprDraft=null;S.iprErr='';render();break;
    case 'iprSave':{const D=S.iprDraft;D.rows=D.rows.filter(r=>!r.isNew||r.recipient||r.problem||r.measure||r.org);if(!D.rows.some(r=>r.isNew)&&c.ipr&&!D.rows.length){}saveIpr(c);break}
    case 'mDone':{const [cc,x]=findM();mDone(cc,x);break}
    case 'mCancel':{const [cc,x]=findM();mCancel(cc,x);break}
    case 'mExec':{const [cc,x]=findM();mExec(cc,x);break}
    case 'vAdd':mVisitAdd(c);break;
    case 'vDone':{const [cc,v]=findV();mVisitDone(cc,v);break}
    case 'sAdd':{const [cc,v]=findV();mSurvey(cc,v);break}
    case 'sView':{const [cc,v]=findV();mSurvey(cc,v,v.surveys.find(s=>s.id===d.id));break}
    case 'sPick':M.onPick(d.id);break;
    case 'monAdd':mMonitoring(c);break;
    case 'mGeo':M.v.geo='51.16942, 71.44911';drawModal();break;
    case 'mDemoPhoto':M.v.media=[...M.v.media,`IMG_${5000+Math.floor(Math.random()*999)}.jpg`];drawModal();break;
    case 'mDemoFile':M.v.file=['Заявление_об_отказе.pdf'];drawModal();break;
    case 'mclose':closeModal();break;
    case 'mbtn':{const b=M.buttons[+d.i];const r=b.act(M.v);if(typeof r==='string'){M.err=r;drawModal();$('#modal .mbody').scrollTop=0}else if(r!==false&&M&&b.act!==closeModal){closeModal();render()}break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&M)closeModal();
  if(e.key==='Enter'&&e.target.matches('tr[data-action]'))e.target.click();
});
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){S.q=el.value;$('#cases-wrap').innerHTML=casesTable();return}
  if(el.dataset.bind){setPath(S,el.dataset.bind,el.value);
    if(el.id==='nd-iin'){const v=el.value.replace(/\D/g,'').slice(0,12);if(v!==el.value)el.value=v;S.nd.iin=v;S.nd.check=null;
      const btn=document.querySelector('[data-action=checkIin]');if(btn)btn.disabled=v.length!==12;
      if(v.length===12)runCheck();}
    if(el.dataset.rerender){if(/\.org$/.test(el.dataset.bind)){const i=el.dataset.bind.split('.')[2];S.iprDraft.rows[i].executor=''}render()}
    if(el.id&&el.id.startsWith('nd-')&&S.nd.src){const k=el.id.slice(3);if(S.nd.src[k]==='ЦКС'&&e.type==='input'){S.nd.src[k]='Ручной ввод'}}
    return}
  if(M&&el.dataset.mv!==undefined){M.v[el.dataset.mv]=el.value;if(el.dataset.mrer){M.err='';drawModal()}return}
  if(M&&el.dataset.mcheck){const k=el.dataset.mcheck;const a=M.v[k]||[];M.v[k]=el.checked?[...a,el.value]:a.filter(x=>x!==el.value);return}
  if(M&&el.dataset.ans){M.onAns(el.dataset.ans,el.value);return}
  if(M&&el.dataset.ansm){M.onAnsMulti(el.dataset.ansm,el.value,el.checked);return}
  if(M&&el.dataset.stpl){M.onTpl(el.value);drawModal();return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.tagName==='SELECT'||el.type==='radio'||el.type==='checkbox'){
    if(el.dataset.bind&&el.dataset.rerender){return}
  }
  if(el.type==='file'){
    const names=[...el.files].map(f=>f.name);if(!names.length)return;
    if(el.dataset.files==='nd'){S.nd.files.push(...names);render()}
    else if(el.dataset.files==='case'){const c=cur();names.forEach(n=>c.docs.push({name:n,from:'Документы кейса',at:nowStr(),by:me()}));log(c,'Добавление документа',{nw:names.join(', ')});render();toast('Документ загружен',true)}
    else if(M&&el.dataset.mfiles){const k=el.dataset.mfiles;M.v[k]=[...(M.v[k]||[]),...names];M.err='';drawModal()}
  }
});
render();
</script>
